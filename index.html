<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e14">
<title>Сальдо — трекер личных финансов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================ ТОКЕНЫ ============================ */
:root{
  --bg:#0e0e14; --bg-soft:#12121b; --panel:#15151f; --panel-2:#1a1a25; --raise:#212130;
  --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.14);
  --txt:#eaecf4; --muted:#8b90a6; --dim:#666b81;
  --income:#4ade80; --income-2:#22c55e; --expense:#f87171; --expense-2:#ef4444;
  --gold:#fbbf24; --gold-2:#f59e0b;
  --acc-1:#4f46e5; --acc-2:#7c3aed; --acc-3:#a855f7;
  --grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 52%,#a855f7 100%);
  --grad-soft:linear-gradient(135deg,rgba(79,70,229,.22),rgba(168,85,247,.16));
  --r-s:9px; --r-m:13px; --r-l:18px; --r-xl:24px;
  --sh:0 1px 0 rgba(255,255,255,.045) inset,0 18px 40px -22px rgba(0,0,0,.85);
  --sh-lift:0 1px 0 rgba(255,255,255,.07) inset,0 28px 55px -24px rgba(0,0,0,.95);
  --font:'Manrope',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
  --glow:0 0 0 1px rgba(124,58,237,.5),0 10px 34px -10px rgba(124,58,237,.75);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f3f4f9; --bg-soft:#eceef5; --panel:#ffffff; --panel-2:#f6f7fb; --raise:#eef0f7;
  --line:rgba(16,18,30,.09); --line-2:rgba(16,18,30,.16);
  --txt:#12141d; --muted:#5d6377; --dim:#868c9f;
  --income:#16a34a; --income-2:#15803d; --expense:#dc2626; --expense-2:#b91c1c;
  --sh:0 1px 0 rgba(255,255,255,.9) inset,0 14px 34px -20px rgba(20,24,50,.35);
  --sh-lift:0 1px 0 rgba(255,255,255,.9) inset,0 26px 48px -22px rgba(20,24,50,.4);
  --glow:0 0 0 1px rgba(124,58,237,.35),0 10px 30px -12px rgba(124,58,237,.5);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt); font-family:var(--font);
  font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow-x:hidden; transition:background .4s,color .4s;
}
::selection{background:rgba(124,58,237,.35)}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid #a855f7;outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ic{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;top:8px;left:8px;z-index:200;padding:10px 16px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line-2);transform:translateY(-160%);transition:.2s}
.skip:focus{transform:none}
/* скроллбары */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--dim);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ============================ ФОН ============================ */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-grid{position:absolute;inset:-2px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;opacity:.5;
  mask-image:radial-gradient(120% 90% at 20% 0%,#000 0%,transparent 70%);
  -webkit-mask-image:radial-gradient(120% 90% at 20% 0%,#000 0%,transparent 70%)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.b1{width:52vw;height:52vw;left:-14vw;top:-18vw;background:radial-gradient(circle,rgba(79,70,229,.42),transparent 65%);animation:drift 34s ease-in-out infinite}
.b2{width:44vw;height:44vw;right:-12vw;top:22vh;background:radial-gradient(circle,rgba(168,85,247,.3),transparent 65%);animation:drift 42s ease-in-out infinite reverse}
.b3{width:38vw;height:38vw;left:26vw;bottom:-20vw;background:radial-gradient(circle,rgba(34,197,94,.14),transparent 65%);animation:drift 50s ease-in-out infinite}
[data-theme="light"] .blob{opacity:.35}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(4vw,-3vh,0) scale(1.08)}66%{transform:translate3d(-3vw,4vh,0) scale(.95)}}

/* ============================ БУТ / ПРОГРЕСС ============================ */
.boot{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;transition:opacity .5s,visibility .5s}
.boot.off{opacity:0;visibility:hidden}
.boot-in{text-align:center;display:grid;gap:18px;justify-items:center}
.boot-bar{width:190px;height:3px;border-radius:99px;background:var(--line-2);overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;background:var(--grad);box-shadow:0 0 14px rgba(124,58,237,.9);transition:width .28s cubic-bezier(.3,.8,.2,1)}
.boot-txt{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.topline{position:fixed;top:0;left:0;right:0;height:2px;z-index:150;pointer-events:none;opacity:0;transition:opacity .3s}
.topline i{display:block;height:100%;width:100%;background:var(--grad);transform:scaleX(0);transform-origin:0 50%;box-shadow:0 0 12px rgba(124,58,237,.8)}
.topline.on{opacity:1}

/* ============================ КАРКАС ============================ */
.shell{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-columns:252px minmax(0,1fr)}
.side{border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.005));backdrop-filter:blur(8px);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 16px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px -8px rgba(124,58,237,.9),inset 0 1px 0 rgba(255,255,255,.3)}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand-sub{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:1px}
.nav{display:grid;gap:3px;position:relative}
.nav-lab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:14px 10px 7px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:12px;color:var(--muted);font-weight:600;font-size:14px;
  transition:color .2s,background .25s,transform .2s;position:relative;text-align:left;width:100%}
.nav-item .ic{transition:transform .3s cubic-bezier(.3,1.4,.4,1)}
.nav-item:hover{color:var(--txt);background:rgba(255,255,255,.045)}
.nav-item:hover .ic{transform:translateX(1px) scale(1.06)}
.nav-item[aria-current="page"]{color:#fff;background:var(--grad-soft);box-shadow:inset 0 0 0 1px rgba(168,85,247,.35),0 8px 24px -14px rgba(124,58,237,.9)}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:50%;translate:0 -50%;width:3px;height:20px;border-radius:0 4px 4px 0;background:var(--acc-3);box-shadow:0 0 14px var(--acc-3)}
.nav-badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--muted)}
.side-foot{margin-top:auto;display:grid;gap:12px;padding-top:16px}
.gauge-card{border:1px solid var(--line);border-radius:var(--r-l);padding:14px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));display:flex;gap:13px;align-items:center}
.gauge-txt small{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600}
.gauge-txt b{font-family:var(--mono);font-size:19px;font-weight:700;display:block;margin-top:2px}
.gauge-txt span{font-size:11.5px;color:var(--muted)}
.ring-fg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1),stroke .4s}
.mini-btn{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;color:var(--muted);font-size:12.5px;font-weight:600;transition:.2s;border:1px solid transparent}
.mini-btn:hover{color:var(--txt);background:rgba(255,255,255,.05);border-color:var(--line)}

.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:18px 26px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tb-title h1{font-size:20px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.tb-title p{font-size:12.5px;color:var(--muted);margin-top:2px}
.tb-acts{margin-left:auto;display:flex;align-items:center;gap:9px}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--muted);display:grid;place-items:center;transition:.22s}
.icon-btn:hover{color:var(--txt);border-color:var(--line-2);background:var(--raise);transform:translateY(-1px)}
.main{padding:26px 26px 60px;display:block}

/* ============================ КНОПКИ / ПОЛЯ ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:11px;
  border:1px solid var(--line-2);background:var(--panel-2);color:var(--txt);font-weight:600;font-size:13.5px;
  transition:transform .2s,box-shadow .25s,border-color .25s,background .25s,color .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);background:var(--raise);border-color:var(--line-2);box-shadow:0 10px 24px -16px rgba(0,0,0,.9)}
.btn:active{transform:translateY(0) scale(.985)}
.btn.primary{border-color:transparent;color:#fff;background:var(--grad);position:relative;overflow:hidden;
  box-shadow:0 10px 28px -12px rgba(124,58,237,.85),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.32) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .7s cubic-bezier(.3,.8,.2,1)}
.btn.primary:hover{box-shadow:var(--glow)}
.btn.primary:hover::after{transform:translateX(120%)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.05)}
.btn.danger{color:#fff;background:linear-gradient(135deg,#dc2626,#f87171);border-color:transparent;box-shadow:0 10px 26px -14px rgba(239,68,68,.9)}
.btn.danger:hover{box-shadow:0 0 0 1px rgba(248,113,113,.5),0 12px 30px -12px rgba(239,68,68,.8)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.field{display:grid;gap:7px;min-width:0}
.lab{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:700}
.inp{height:42px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);padding:0 13px;font-size:14px;width:100%;
  transition:border-color .22s,box-shadow .22s,background .22s}
.inp::placeholder{color:var(--dim)}
.inp:hover{border-color:color-mix(in srgb,var(--acc-3) 35%,var(--line-2))}
.inp:focus{border-color:var(--acc-3);box-shadow:0 0 0 4px rgba(168,85,247,.16);background:var(--bg-soft)}
select.inp{appearance:none;background-image:none;cursor:pointer;padding-right:34px}
.sel-wrap{position:relative}
.sel-wrap .ic{position:absolute;right:11px;top:50%;translate:0 -50%;color:var(--muted);pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err{font-size:12px;color:var(--expense);display:none;align-items:center;gap:5px;font-weight:600}
.err.on{display:flex;animation:shake .3s}
.invalid .inp,.invalid .amount-in{border-color:var(--expense);box-shadow:0 0 0 4px rgba(248,113,113,.13)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.hint{font-size:12px;color:var(--muted)}

.seg{position:relative;display:inline-flex;padding:3px;border-radius:12px;background:var(--panel);border:1px solid var(--line);gap:2px}
.seg-thumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--grad);
  box-shadow:0 6px 18px -8px rgba(124,58,237,.9),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .34s cubic-bezier(.35,1.3,.4,1),width .34s cubic-bezier(.35,1.3,.4,1);z-index:0}
.seg-btn{position:relative;z-index:1;height:32px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);
  display:inline-flex;align-items:center;gap:7px;transition:color .25s}
.seg-btn[aria-pressed="true"]{color:#fff}
.seg-btn:hover{color:var(--txt)}
.seg-btn[aria-pressed="true"]:hover{color:#fff}
.seg.lg .seg-btn{height:38px;padding:0 18px;font-size:14px}

.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:11px;border:1px solid var(--line-2);
  background:var(--panel);font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
.chip:hover{color:var(--txt);transform:translateY(-1px);border-color:color-mix(in srgb,var(--c,var(--acc-3)) 45%,var(--line-2))}
.chip[aria-pressed="true"]{color:#fff;border-color:transparent;background:color-mix(in srgb,var(--c,var(--acc-2)) 26%,var(--panel));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,var(--acc-3)) 65%,transparent),0 8px 22px -14px var(--c,var(--acc-3))}
.chip[aria-pressed="true"] .ic{color:var(--c,var(--acc-3))}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;
  background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line)}
.tag.up{color:var(--income);background:color-mix(in srgb,var(--income) 13%,transparent);border-color:color-mix(in srgb,var(--income) 30%,transparent)}
.tag.down{color:var(--expense);background:color-mix(in srgb,var(--expense) 13%,transparent);border-color:color-mix(in srgb,var(--expense) 30%,transparent)}
.tag.gold{color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:color-mix(in srgb,var(--gold) 34%,transparent)}

/* ============================ КАРТОЧКИ ============================ */
.card{position:relative;border-radius:var(--r-l);border:1px solid var(--line);background:
  linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012)),var(--panel);
  box-shadow:var(--sh);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s}
.card.lift:hover{transform:translateY(-3px);box-shadow:var(--sh-lift);border-color:var(--line-2)}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.card-h p{font-size:12px;color:var(--muted)}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:18px}
.stack{display:grid;gap:18px}
.grid-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.charts{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:18px}
.bottom-row{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px}

/* HERO */
.hero{position:relative;border-radius:var(--r-xl);padding:1px;
  background:linear-gradient(140deg,rgba(168,85,247,.6),rgba(79,70,229,.25) 38%,rgba(255,255,255,.07) 72%);
  box-shadow:0 40px 80px -50px rgba(124,58,237,.7)}
.hero::before{content:"";position:absolute;inset:-40% -10% auto;height:140%;
  background:conic-gradient(from 0deg,transparent 0 42%,rgba(124,58,237,.35) 50%,transparent 58% 100%);
  filter:blur(60px);opacity:.55;animation:spin 26s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(1turn)}}
.hero-in{position:relative;border-radius:calc(var(--r-xl) - 1px);overflow:hidden;
  background:radial-gradient(130% 150% at 0% 0%,#1d1c30 0%,#15151f 42%,#101018 100%);padding:26px 28px 22px}
[data-theme="light"] .hero-in{background:radial-gradient(130% 150% at 0% 0%,#ffffff 0%,#f7f7fd 45%,#f1f2f9 100%)}
.hero-top{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
.hero-lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700;display:flex;align-items:center;gap:8px}
.balance{font-family:var(--mono);font-weight:700;font-size:clamp(2.4rem,6.4vw,4rem);line-height:1;letter-spacing:-.045em;margin-top:12px;
  display:flex;align-items:baseline;gap:6px;text-shadow:0 0 60px rgba(168,85,247,.35)}
.balance .cur{font-size:.44em;color:var(--muted);font-weight:500;letter-spacing:0}
.balance.neg{color:var(--expense)}
.delta{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;font-size:12.5px;font-weight:700;margin-top:14px;
  border:1px solid var(--line-2);background:rgba(255,255,255,.045)}
.delta.pos{color:var(--income);border-color:color-mix(in srgb,var(--income) 34%,transparent);background:color-mix(in srgb,var(--income) 12%,transparent);box-shadow:0 0 26px -12px var(--income)}
.delta.neg{color:var(--expense);border-color:color-mix(in srgb,var(--expense) 34%,transparent);background:color-mix(in srgb,var(--expense) 12%,transparent);box-shadow:0 0 26px -12px var(--expense)}
.delta span{color:var(--muted);font-weight:600}
.spark-wrap{margin-left:auto;min-width:200px;flex:1;max-width:340px}
.spark-wrap svg{width:100%;height:88px;display:block;overflow:visible}
.spark-line{fill:none;stroke:var(--acc-3);stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(168,85,247,.65))}
.spark-area{fill:url(#sparkFill);opacity:0;transition:opacity 1s .3s}
.drawn .spark-area{opacity:1}
.spark-dot{fill:var(--acc-3);filter:drop-shadow(0 0 8px rgba(168,85,247,.9))}
.spark-pulse{fill:none;stroke:var(--acc-3);stroke-width:1.5;opacity:0;animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{r:3;opacity:.75}100%{r:13;opacity:0}}
.hero-meta{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.hm{display:grid;gap:3px}
.hm small{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:700}
.hm b{font-family:var(--mono);font-size:15.5px;font-weight:600}
.hm b.i{color:var(--income)} .hm b.e{color:var(--expense)}

/* STAT */
.stat{padding:18px}
.stat-top{display:flex;align-items:center;gap:10px}
.ico-chip{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);
  border:1px solid color-mix(in srgb,var(--c) 32%,transparent);
  box-shadow:0 0 22px -10px var(--c);transition:transform .3s,box-shadow .3s}
.card.lift:hover .ico-chip{transform:scale(1.08) rotate(-4deg);box-shadow:0 0 28px -6px var(--c)}
.stat h4{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat-val{font-family:var(--mono);font-size:clamp(1.35rem,2.6vw,1.75rem);font-weight:700;letter-spacing:-.04em;margin-top:14px;display:block}
.stat-val.i{color:var(--income)} .stat-val.e{color:var(--expense)}
.stat-sub{font-size:12px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:6px}
.mbar{height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:14px}
.mbar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--acc-3));width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px var(--c,var(--acc-3))}

/* PERIOD BAR */
.period{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.period-nav{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);padding:3px}
.pbtn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:.2s}
.pbtn:hover:not(:disabled){background:rgba(255,255,255,.07);color:var(--txt)}
.pbtn:disabled{opacity:.3;cursor:not-allowed}
.period-label{font-weight:700;font-size:13.5px;padding:0 8px;min-width:132px;text-align:center;text-transform:capitalize}

/* CHARTS */
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;overflow:visible}
.grid-line{stroke:var(--line);stroke-width:1}
.axis-lab{fill:var(--dim);font-family:var(--mono);font-size:10px}
.axis-lab.mon{fill:var(--muted);font-family:var(--font);font-size:11px;font-weight:600;text-transform:capitalize}
.bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .85s cubic-bezier(.2,.85,.25,1),opacity .25s}
.drawn .bar{transform:scaleY(1)}
.g-group{cursor:pointer}
.g-group .hit{fill:transparent}
.g-group:hover .bar,.g-group.hot .bar{filter:brightness(1.18)}
.charts.dim .g-group:not(.hot) .bar{opacity:.32}
.zero-stub{fill:var(--line-2)}
.tip{position:absolute;z-index:12;pointer-events:none;opacity:0;transform:translate(-50%,-108%) scale(.96);
  transition:opacity .18s,transform .18s;background:color-mix(in srgb,var(--raise) 94%,transparent);
  border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;box-shadow:0 20px 40px -18px rgba(0,0,0,.9);min-width:150px;backdrop-filter:blur(8px)}
.tip.on{opacity:1;transform:translate(-50%,-112%) scale(1)}
.tip b{display:block;font-size:12px;text-transform:capitalize;margin-bottom:6px;letter-spacing:-.01em}
.tip .tr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:3px}
.tip .tr b{margin:0 0 0 auto;font-family:var(--mono);font-size:12.5px;color:var(--txt)}
.dot{width:8px;height:8px;border-radius:3px;flex:none;background:var(--c)}
.legend{display:grid;gap:2px;margin-top:6px;max-height:236px;overflow:auto;padding-right:4px}
.lg-row{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:11px;width:100%;text-align:left;transition:background .2s,transform .2s}
.lg-row:hover{background:rgba(255,255,255,.05);transform:translateX(2px)}
.lg-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-amt{margin-left:auto;font-family:var(--mono);font-size:12.5px;font-weight:600}
.lg-pct{font-family:var(--mono);font-size:11px;color:var(--dim);width:38px;text-align:right}
.donut-holder{position:relative;display:grid;place-items:center}
.donut-holder svg{width:100%;max-width:216px;height:auto}
.donut-seg{fill:none;stroke-linecap:butt;transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1),stroke-width .25s,opacity .25s;cursor:pointer}
.donut-center{position:absolute;text-align:center;pointer-events:none}
.donut-center small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.donut-center b{display:block;font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:-.03em;margin-top:3px}
.donut-center span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;max-width:120px}
.donut.hov .donut-seg{opacity:.28}
.donut.hov .donut-seg.hot{opacity:1;stroke-width:26}
.chart-legend-inline{display:flex;gap:16px;font-size:12px;color:var(--muted);font-weight:600}
.chart-legend-inline i{display:inline-flex;align-items:center;gap:7px}

/* TX LIST */
.tx-group{border-bottom:1px solid var(--line)}
.tx-group:last-child{border-bottom:none}
.day-h{display:flex;align-items:center;gap:10px;padding:11px 18px;background:color-mix(in srgb,var(--bg-soft) 60%,transparent);
  position:sticky;top:0;z-index:2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.day-h b{font-size:12.5px;font-weight:700}
.day-h small{font-size:11.5px;color:var(--dim);text-transform:capitalize}
.day-h .sum{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tx{display:grid;grid-template-columns:42px minmax(0,1fr) auto auto;align-items:center;gap:13px;padding:12px 18px;
  transition:background .2s,opacity .35s,transform .35s,max-height .35s;position:relative;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.tx:last-child{border-bottom:none}
.tx:hover{background:rgba(255,255,255,.035)}
.tx.removing{opacity:0;transform:translateX(26px)}
.tx-cat{font-size:13.8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-note{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tx-date{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap}
.tx-amt{font-family:var(--mono);font-size:14.5px;font-weight:600;white-space:nowrap}
.tx-amt.i{color:var(--income)} .tx-amt.e{color:var(--txt)}
.tx-acts{display:flex;gap:4px;opacity:0;transform:translateX(6px);transition:.2s}
.tx:hover .tx-acts,.tx:focus-within .tx-acts{opacity:1;transform:none}
.act{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--dim);border:1px solid transparent;transition:.18s}
.act:hover{background:var(--raise);color:var(--txt);border-color:var(--line-2)}
.act.del:hover{color:var(--expense);border-color:color-mix(in srgb,var(--expense) 40%,transparent);background:color-mix(in srgb,var(--expense) 12%,transparent)}
.filters{display:grid;gap:12px;padding:16px 18px}
.f-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:180px}
.search .ic{position:absolute;left:12px;top:50%;translate:0 -50%;color:var(--dim)}
.search .inp{padding-left:36px;height:38px}
.sum-strip{display:flex;gap:22px;flex-wrap:wrap;padding:13px 18px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg-soft) 45%,transparent)}
.sum-strip div{display:flex;align-items:baseline;gap:7px;font-size:12px;color:var(--muted)}
.sum-strip b{font-family:var(--mono);font-size:13.5px;color:var(--txt);font-weight:600}

/* EMPTY */
.empty{display:grid;justify-items:center;gap:14px;padding:52px 24px;text-align:center}
.empty-art{width:96px;height:76px;opacity:.85}
.empty-art *{stroke:var(--dim);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.empty-art .dash{stroke-dasharray:4 5;opacity:.7;animation:march 14s linear infinite}
@keyframes march{to{stroke-dashoffset:-90}}
.empty h4{font-size:16px;font-weight:700;letter-spacing:-.01em}
.empty p{font-size:13px;color:var(--muted);max-width:330px}
.empty-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:2px}

/* CATEGORIES */
.cat-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.cat-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;
  border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);transition:background .2s}
.cat-row:last-child{border-bottom:none}
.cat-row:hover{background:rgba(255,255,255,.032)}
.cat-row .nm{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.cat-row .sub{font-size:11.5px;color:var(--dim);margin-top:3px;display:flex;gap:8px;align-items:center}
.cat-sum{font-family:var(--mono);font-size:13.5px;font-weight:600;text-align:right;white-space:nowrap}
.cat-share{height:3px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:7px;overflow:hidden}
.cat-share i{display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px var(--c)}
.cat-acts{display:flex;gap:2px;margin-left:6px;opacity:0;transition:.2s}
.cat-row:hover .cat-acts,.cat-row:focus-within .cat-acts{opacity:1}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:10px;background:var(--c);border:2px solid transparent;transition:.2s;position:relative}
.sw:hover{transform:scale(1.12)}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--c),0 6px 18px -8px var(--c)}
.sw[aria-pressed="true"]::after{content:"";position:absolute;inset:0;border-radius:8px;background:rgba(0,0,0,.18)}
.icons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.ic-pick{height:44px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);background:var(--panel);transition:.18s}
.ic-pick:hover{color:var(--txt);border-color:var(--line-2);transform:translateY(-2px)}
.ic-pick[aria-pressed="true"]{color:#fff;background:var(--grad-soft);border-color:color-mix(in srgb,var(--acc-3) 55%,transparent)}

/* GOALS */
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:18px}
.goal{padding:18px;display:grid;gap:14px;overflow:hidden}
.goal::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(120% 90% at 100% 0%,rgba(251,191,36,.16),transparent 60%)}
.goal.done{border-color:color-mix(in srgb,var(--gold) 45%,transparent);box-shadow:0 0 0 1px rgba(251,191,36,.22),0 26px 50px -30px rgba(251,191,36,.7)}
.goal.done::after{opacity:1}
.goal-h{display:flex;gap:12px;align-items:flex-start}
.goal-h h4{font-size:15.5px;font-weight:700;letter-spacing:-.015em}
.goal-badge{margin-left:auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);
  box-shadow:0 0 22px -8px var(--gold)}
.goal-nums{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.goal-nums b{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.035em}
.goal-nums span{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.prog{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;background:var(--grad);
  transition:width 1.2s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 16px rgba(124,58,237,.75)}
.goal.done .prog i{background:linear-gradient(90deg,#f59e0b,#fbbf24);box-shadow:0 0 18px rgba(251,191,36,.8)}
.prog-t{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);font-family:var(--mono);margin-top:6px}
.goal-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.dl.late{color:var(--expense);border-color:color-mix(in srgb,var(--expense) 35%,transparent)}
.dl.soon{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 35%,transparent)}
.goal-acts{margin-left:auto;display:flex;gap:6px}

/* SETTINGS */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.set-row{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);flex-wrap:wrap}
.set-row:last-child{border-bottom:none}
.set-row .t{min-width:0;flex:1}
.set-row .t b{display:block;font-size:13.8px;font-weight:600}
.set-row .t span{font-size:12px;color:var(--muted)}
.set-row .c{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.danger-card{border-color:color-mix(in srgb,var(--expense) 30%,transparent)}
.store-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:10px;max-width:220px}
.store-bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .9s}
kbd{font-family:var(--mono);font-size:11px;padding:3px 7px;border-radius:6px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--muted)}

/* ============================ МОДАЛКИ ============================ */
.modal-root{position:fixed;inset:0;z-index:120;display:none}
.modal-root.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(5,5,10,.66);backdrop-filter:blur(7px) saturate(1.1);opacity:0;transition:opacity .26s}
[data-theme="light"] .backdrop{background:rgba(30,32,48,.4)}
.backdrop.in{opacity:1}
.modal{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);
  overflow:auto;border-radius:var(--r-xl);border:1px solid var(--line-2);background:linear-gradient(180deg,var(--panel-2),var(--panel));
  box-shadow:0 50px 100px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.04) inset;
  opacity:0;transform:translate(-50%,-46%) scale(.96);transition:opacity .26s cubic-bezier(.2,.9,.2,1),transform .3s cubic-bezier(.2,.9,.2,1)}
[data-theme="light"] .modal{box-shadow:0 40px 90px -30px rgba(20,24,50,.4)}
.modal.in{opacity:1;transform:translate(-50%,-50%) scale(1)}
.modal.wide{width:min(720px,calc(100vw - 32px))}
.modal-h{display:flex;align-items:flex-start;gap:14px;padding:20px 22px 14px;position:sticky;top:0;z-index:2;
  background:linear-gradient(180deg,var(--panel-2),color-mix(in srgb,var(--panel-2) 82%,transparent));backdrop-filter:blur(6px)}
.modal-h h2{font-size:17px;font-weight:800;letter-spacing:-.02em}
.modal-h p{font-size:12.5px;color:var(--muted);margin-top:2px}
.modal-h .x{margin-left:auto}
.modal-b{padding:6px 22px 8px;display:grid;gap:16px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px 20px;position:sticky;bottom:0;
  background:linear-gradient(0deg,var(--panel),color-mix(in srgb,var(--panel) 70%,transparent));backdrop-filter:blur(6px)}
.amount-in{display:flex;align-items:center;gap:10px;height:62px;border-radius:15px;border:1px solid var(--line-2);background:var(--bg-soft);padding:0 16px;transition:.22s}
.amount-in:focus-within{border-color:var(--acc-3);box-shadow:0 0 0 4px rgba(168,85,247,.16)}
.amount-in .cur{font-family:var(--mono);font-size:20px;color:var(--muted)}
.amount-in input{font-family:var(--mono);font-size:27px;font-weight:700;letter-spacing:-.04em;width:100%;background:transparent}
.cat-grid{display:flex;flex-wrap:wrap;gap:7px}
.kbd-list{display:grid;gap:9px}
.kbd-row{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.kbd-row .k{margin-left:auto;display:flex;gap:5px}
.confirm-ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--expense) 15%,transparent);color:var(--expense);border:1px solid color-mix(in srgb,var(--expense) 35%,transparent)}

/* ============================ TOAST ============================ */
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:grid;gap:10px;justify-items:end;pointer-events:none}
.toast{pointer-events:auto;position:relative;overflow:hidden;display:flex;gap:11px;align-items:flex-start;width:min(346px,calc(100vw - 32px));
  padding:13px 15px;border-radius:14px;border:1px solid var(--line-2);background:color-mix(in srgb,var(--raise) 92%,transparent);
  backdrop-filter:blur(12px);box-shadow:0 24px 50px -20px rgba(0,0,0,.9);
  opacity:0;transform:translateY(14px) scale(.97);transition:opacity .3s,transform .35s cubic-bezier(.2,1.2,.3,1)}
.toast.in{opacity:1;transform:none}
.toast.out{opacity:0;transform:translateX(30px) scale(.96)}
.toast .ti{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
.toast b{display:block;font-size:13.4px;font-weight:700}
.toast span{display:block;font-size:12.2px;color:var(--muted);margin-top:1px}
.toast .undo{margin-left:auto;align-self:center;font-size:12px;font-weight:700;color:var(--acc-3);padding:5px 9px;border-radius:8px;border:1px solid color-mix(in srgb,var(--acc-3) 35%,transparent);transition:.2s}
.toast .undo:hover{background:var(--grad-soft)}
.toast i.pg{position:absolute;left:0;bottom:0;height:2px;background:var(--c);width:100%;transform-origin:0 50%;animation:drain var(--d,4s) linear forwards}
@keyframes drain{to{transform:scaleX(0)}}

/* ============================ MOBILE NAV ============================ */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:90;padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar .in{display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:grid;justify-items:center;gap:4px;padding:8px 2px;border-radius:13px;color:var(--dim);font-size:10px;font-weight:700;transition:.22s;position:relative}
.tab .ic{transition:transform .3s cubic-bezier(.3,1.5,.4,1)}
.tab[aria-current="page"]{color:#fff}
.tab[aria-current="page"] .ic{color:var(--acc-3);transform:translateY(-2px) scale(1.1);filter:drop-shadow(0 4px 12px rgba(168,85,247,.75))}
.tab[aria-current="page"]::before{content:"";position:absolute;top:1px;width:22px;height:3px;border-radius:99px;background:var(--grad);box-shadow:0 0 12px var(--acc-3)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:95;width:54px;height:54px;border-radius:19px;
  display:none;place-items:center;background:var(--grad);color:#fff;box-shadow:var(--glow)}

/* ============================ REVEAL / АНИМАЦИИ ============================ */
[data-reveal]{opacity:0;transform:translateY(16px)}
[data-reveal].in{opacity:1;transform:none;transition:opacity .65s cubic-bezier(.2,.8,.2,1),transform .65s cubic-bezier(.2,.8,.2,1)}
.view{display:none}
.view.on{display:block;animation:vIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes vIn{from{opacity:0;transform:translateY(10px)}}
.pop{animation:pop .4s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}}

/* ============================ АДАПТИВ ============================ */
@media (max-width:1180px){
  .charts{grid-template-columns:1fr}
  .cat-cols{grid-template-columns:1fr}
  .cat-cols[data-tab="income"] .col-expense{display:none}
  .cat-cols[data-tab="expense"] .col-income{display:none}
  .cat-tabs{display:inline-flex!important}
}
@media (max-width:1000px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .tabbar{display:block}
  .fab{display:grid}
  .main{padding:18px 16px 116px}
  .topbar{padding:14px 16px}
  .bottom-row{grid-template-columns:1fr}
  .toasts{bottom:calc(88px + env(safe-area-inset-bottom));justify-items:stretch;right:12px;left:12px}
  .day-h{position:static}
}
@media (max-width:720px){
  .grid-stats{grid-template-columns:1fr}
  .hero-in{padding:20px}
  .spark-wrap{max-width:none;min-width:0;margin:18px 0 0}
  .row2{grid-template-columns:1fr}
  .tb-title p{display:none}
  .tx{grid-template-columns:38px minmax(0,1fr) auto;row-gap:4px}
  .tx-date{grid-column:2/3;font-size:11px}
  .tx-amt{grid-row:1/3;grid-column:3/4;text-align:right}
  .tx-acts{opacity:1;transform:none;grid-column:2/3;grid-row:3}
  .modal{width:calc(100vw - 20px);max-height:calc(100vh - 24px)}
  .modal-f .btn{flex:1}
}
@media (max-width:420px){ .balance{font-size:2.15rem} .hero-meta{gap:16px} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  [data-reveal]{opacity:1;transform:none}
}
</style>
</head>
<body>
<a class="skip" href="#main">Перейти к содержимому</a>

<div class="boot" id="boot">
  <div class="boot-in">
    <div class="brand-mark" style="width:44px;height:44px;border-radius:14px">

const catById = id => state.categories.find(c=>c.id===id) || null;
const catsByType = t => state.categories.filter(c=>c.type===t);
const unknownCat = {id:'',name:'Без категории',icon:'box',color:'#64748b'};
const txCat = t => catById(t.categoryId)||unknownCat;
const byDateDesc = (a,b)=> a.date<b.date?1:a.date>b.date?-1:(b.created||0)-(a.created||0);
function inPeriod(t, period){
  if(period==='all') return true;
  if(period==='week'){ const s=weekStartISO(state.settings.weekStart); const e=new Date(parseISO(s)); e.setDate(e.getDate()+6); return parseISO(t.date)>=parseISO(s)&&parseISO(t.date)<=e; }
  if(period==='month') return mKey(t.date)===curMK();
  if(period==='prev') return mKey(t.date)===shiftMK(curMK(),-1);
  return mKey(t.date)===period;
}
function sums(list){
  let inc=0, exp=0;
  for(const t of list){ if(t.type==='income') inc+=t.amount; else exp+=t.amount; }
  return {inc:Math.round(inc*100)/100, exp:Math.round(exp*100)/100, net:Math.round((inc-exp)*100)/100};
}
const balanceAll = () => sums(state.transactions).net;
function balanceBefore(isoExclusive){
  return sums(state.transactions.filter(t=>t.date<isoExclusive)).net;
}
function monthBounds(k){ const [y,m]=k.split('-').map(Number); const s=new Date(y,m-1,1); const e=new Date(y,m,0); return [isoOf(s),isoOf(e)]; }
function txInMonth(k){ const [s,e]=monthBounds(k); return state.transactions.filter(t=>t.date>=s&&t.date<=e); }
function catTotals(k, type){
  const map=new Map();
  for(const t of txInMonth(k)){ if(t.type!==type) continue; map.set(t.categoryId,(map.get(t.categoryId)||0)+t.amount); }
  return map;
}
function allMonths(){
  const set=new Set([curMK()]);
  state.transactions.forEach(t=>set.add(mKey(t.date)));
  return Array.from(set).sort().reverse();
}
function storageBytes(){ try{ return new Blob([localStorage.getItem(LS)||'']).size; }catch(e){ return 0; } }

/* ---------- 6. ЧИСЛА С АНИМАЦИЕЙ ---------- */
const shown = new Map();
function countTo(node, value, fmt){
  if(!node) return;
  const key=node.dataset.k||node.id;
  const from = shown.has(key)?shown.get(key):value;
  shown.set(key,value);
  if(RM || from===value){ node.textContent=fmt(value); return; }
  const t0=performance.now(), dur=760;
  function step(now){
    const p=clamp((now-t0)/dur,0,1), e=1-Math.pow(1-p,3);
    node.textContent=fmt(from+(value-from)*e);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- 7. REVEAL ---------- */
let io;
function reveals(root){
  const nodes=$$('[data-reveal]',root||document).filter(n=>!n.dataset.ro);
  if(!nodes.length) return;
  nodes.forEach((n,i)=>{ n.style.transitionDelay=Math.min(i*45,320)+'ms'; n.dataset.ro='1'; });
  if(RM){ nodes.forEach(n=>n.classList.add('in')); return; }
  if(!io) io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),{threshold:.08,rootMargin:'0px 0px -40px'});
  nodes.forEach(n=>io.observe(n));
}

function toast(title, kind='ok', o={}){
  const colors={ok:'var(--income)',info:'var(--acc-3)',warn:'var(--gold)',danger:'var(--expense)'};
  const icons={ok:'checkCircle',info:'info',warn:'alert',danger:'alert'};
  const wrap=$('#toasts');
  const el=document.createElement('div');
  el.className='toast'; el.style.setProperty('--c',colors[kind]||colors.ok);
  const dur=o.duration||4000;
  el.innerHTML='<span class="ti">'+svg(icons[kind]||'info',16)+'</span><div style="min-width:0"><b>'+esc(title)+'</b>'+
    (o.desc?'<span>'+esc(o.desc)+'</span>':'')+'</div>'+
    (o.action?'<button class="undo" type="button">'+esc(o.action.label)+'</button>':'')+'<i class="pg" style="--d:'+dur+'ms"></i>';
  wrap.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('in'));
  const kill=()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),320); };
  const timer=setTimeout(kill,dur);
  if(o.action) el.querySelector('.undo').addEventListener('click',()=>{ clearTimeout(timer); o.action.fn(); kill(); });
  el.addEventListener('mouseenter',()=>{clearTimeout(timer);el.querySelector('.pg').style.animationPlayState='paused';});
  el.addEventListener('mouseleave',()=>{ el.querySelector('.pg').style.animationPlayState='running'; setTimeout(kill,1400); });
}

/* ---------- 9. МОДАЛКИ ---------- */
const modalStack=[];
function openModal(cfg){
  const root=$('#modalRoot');
  root.classList.add('open');
  const bd=document.createElement('div'); bd.className='backdrop';
  const m=document.createElement('div');
  m.className='modal '+(cfg.size||'');
  m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.id='md'+modalStack.length+'-'+Date.now();
  const titleId=m.id+'-t';
  m.setAttribute('aria-labelledby',titleId);
  m.innerHTML=
    '<div class="modal-h"><div style="min-width:0"><h2 id="'+titleId+'">'+esc(cfg.title)+'</h2>'+
      (cfg.sub?'<p>'+esc(cfg.sub)+'</p>':'')+'</div>'+
      '<button class="icon-btn x" type="button" data-close aria-label="Закрыть">'+svg('x',16)+'</button></div>'+
    '<div class="modal-b">'+cfg.body+'</div>'+
    (cfg.footer?'<div class="modal-f">'+cfg.footer+'</div>':'');
  root.appendChild(bd); root.appendChild(m);
  const api={el:m,bd,close(open){
    m.classList.remove('in'); bd.classList.remove('in');
    setTimeout(()=>{ m.remove(); bd.remove(); if(!modalStack.length) root.classList.remove('open'); },240);
    if(open) open.focus?.();
  }};
  const idx=modalStack.push(api)-1;
  api.idx=idx;
  bd.addEventListener('click',()=>closeModal(api));
  m.querySelector('[data-close]').addEventListener('click',()=>closeModal(api));
  requestAnimationFrame(()=>{ bd.classList.add('in'); m.classList.add('in'); });
  setTimeout(()=>{
    const f=m.querySelector('input:not([type=hidden]),select,button.primary,button');
    (cfg.focus?m.querySelector(cfg.focus):f)?.focus();
  },90);
  cfg.onMount?.(m,api);
  return api;
}
function closeModal(api){
  const i=modalStack.indexOf(api); if(i<0) return;
  modalStack.splice(i,1); api.close();
}
function closeTopModal(){ const a=modalStack[modalStack.length-1]; if(a) closeModal(a); }
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modalStack.length){ e.preventDefault(); closeTopModal(); return; }
  if(e.key==='Tab'&&modalStack.length){
    const m=modalStack[modalStack.length-1].el;
    const f=$$('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea,[tabindex]:not([tabindex="-1"])',m).filter(x=>x.offsetParent!==null);
    if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
    return;
  }
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||'')||document.activeElement?.isContentEditable;
  if(typing) return;
  const k=e.key.toLowerCase();
  if(k==='n'&&!e.metaKey&&!e.ctrlKey){ e.preventDefault(); txModal(); }
  else if(k==='/'){ e.preventDefault(); if(ui.view!=='transactions') go('transactions'); setTimeout(()=>$('#txSearch')?.focus(),260); }
  else if(k==='t'){ toggleTheme(); }
  else if(k==='?'){ e.preventDefault(); shortcutsModal(); }
  else if(/^[1-5]$/.test(k)){ e.preventDefault(); go(VIEWS[+k-1].id); }
});
function confirmDlg(o){

    const api=openModal({
      title:o.title, sub:o.sub||'',
      body:'<div style="display:flex;gap:14px;align-items:flex-start">'+
             '<div class="confirm-ico">'+svg(o.icon||'alert',20)+'</div>'+
             '<div style="font-size:13.6px;color:var(--muted);line-height:1.55">'+o.text+'</div></div>',
      footer:'<button class="btn ghost" data-r="0">'+esc(o.cancel||'Отмена')+'</button>'+
             '<button class="btn '+(o.danger?'danger':'primary')+'" data-r="1">'+esc(o.confirm||'Подтвердить')+'</button>',
      focus:'[data-r="1"]'
    });
    api.el.querySelector('.modal-f').addEventListener('click',e=>{
      const b=e.target.closest('[data-r]'); if(!b) return;
      closeModal(api); res(b.dataset.r==='1');

/* ===== СПАРКЛАЙН (баланс за 30 дней) ===== */
function mountSpark(host, k){
  const end=k===curMK()?todayISO():monthBounds(k)[1];
  const start=new Date(parseISO(end)); start.setDate(start.getDate()-29);
  const pts=[]; let run=balanceBefore(isoOf(start));
  const days=[]; for(let i=0;i<30;i++){ const d=new Date(start); d.setDate(start.getDate()+i); days.push(d); }
  const byDay=new Map();
  for(const t of state.transactions){ if(t.date>=isoOf(start)&&t.date<=end) byDay.set(t.date,(byDay.get(t.date)||0)+(t.type==='income'?t.amount:-t.amount)); }
  for(const d of days){ const key=isoOf(d); run+=(byDay.get(key)||0); pts.push(run); }
  const W=320,H=88,P=6;
  const min=Math.min(...pts), max=Math.max(...pts), span=(max-min)||1;
  const xy=pts.map((v,i)=>({x:P+i*((W-P*2)/(pts.length-1)), y:H-P-((v-min)/span)*(H-P*2)}));
  const line=smooth(xy);
  const area=line+' L'+xy[xy.length-1].x+','+H+' L'+xy[0].x+','+H+' Z';
  const last=xy[xy.length-1];
  host.innerHTML='<svg viewBox="0 0 '+W+' '+H+' " preserveAspectRatio="none" aria-hidden="true" role="img">'+
    '<defs><linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" style="stop-color:var(--acc-3);stop-opacity:.38"/><stop offset="1" style="stop-color:var(--acc-3);stop-opacity:0"/></linearGradient></defs>'+
    '<path class="spark-area" d="'+area+'"/>'+
    '<path class="spark-line" d="'+line+'" vector-effect="non-scaling-stroke"/>'+
    '<circle class="spark-pulse" cx="'+last.x+'" cy="'+last.y+'" r="3" vector-effect="non-scaling-stroke"/>'+
    '<circle class="spark-dot" cx="'+last.x+'" cy="'+last.y+'" r="3.2"/></svg>'+
    '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:6px;font-family:var(--mono)">'+
      '<span>−30 дней</span><span>динамика баланса</span></div>';
  const p=host.querySelector('.spark-line');
  if(p&&!RM){ try{ const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
    requestAnimationFrame(()=>{ p.style.transition='stroke-dashoffset 1.3s cubic-bezier(.3,.9,.2,1)'; p.style.strokeDashoffset=0; }); }catch(e){} }
  host.classList.add('drawn');
}
function smooth(pt){
  if(pt.length<2) return 'M'+(pt[0]?.x||0)+','+(pt[0]?.y||0);
  let d='M'+pt[0].x+','+pt[0].y;
  for(let i=0;i<pt.length-1;i++){
    const p0=pt[i-1]||pt[i], p1=pt[i], p2=pt[i+1], p3=pt[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6*.75, c1y=p1.y+(p2.y-p0.y)/6*.75;
    const c2x=p2.x-(p3.x-p1.x)/6*.75, c2y=p2.y-(p3.y-p1.y)/6*.75;
    d+=' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2.x.toFixed(1)+','+p2.y.toFixed(1);
  }
  return d;
}

/* ===== СТОЛБЧАТЫЙ ГРАФИК ===== */
function mountBars(host, series){
  if(!host) return;
  const W=Math.max(320,host.clientWidth||600), H=W<560?206:248;
  const PL=W<520?38:52, PR=6, PT=14, PB=30;
  const pw=W-PL-PR, ph=H-PT-PB;
  const max=niceMax(Math.max(1,...series.flatMap(s=>[s.income,s.expense])));
  const gw=pw/series.length;
  const bw=clamp(gw*0.22,7,20), gap=Math.min(6,bw*0.4);
  let g='';
  for(let i=0;i<=4;i++){ const y=PT+ph-(ph*i/4);
    g+='<line class="grid-line" x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>'+
       '<text class="axis-lab" x="'+(PL-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+compact(max*i/4)+'</text>'; }
  series.forEach((s,i)=>{
    const cx=PL+gw*i+gw/2;
    const h1=Math.max(2,(s.income/max)*ph), h2=Math.max(2,(s.expense/max)*ph);
    const y1=PT+ph-h1, y2=PT+ph-h2;
    g+='<g class="g-group" data-i="'+i+'">'+
       '<rect class="hit" x="'+(PL+gw*i)+'" y="'+PT+'" width="'+gw+'" height="'+ph+'"/>'+
       (s.income>0?'<path class="bar" style="transition-delay:'+(i*45)+'ms" fill="url(#gInc)" d="'+topBar(cx-bw-gap/2,y1,bw,h1,Math.min(5,bw/2))+'"/>':stub(cx-bw-gap/2,y1,bw))+
       (s.expense>0?'<path class="bar" style="transition-delay:'+(i*45+70)+'ms" fill="url(#gExp)" d="'+topBar(cx+gap/2,y2,bw,h2,Math.min(5,bw/2))+'"/>':stub(cx+gap/2,y2,bw))+
       '<text class="axis-lab mon" x="'+cx.toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">'+esc(mkShort(s.key))+'</text>'+
       '</g>';
  });
  host.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" height="'+H+'" role="img" aria-label="Доходы и расходы по месяцам">'+
    '<defs>'+
      '<linearGradient id="gInc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--income)"/><stop offset="1" style="stop-color:var(--income);stop-opacity:.35"/></linearGradient>'+
      '<linearGradient id="gExp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--expense)"/><stop offset="1" style="stop-color:var(--expense);stop-opacity:.32"/></linearGradient>'+
    '</defs>'+
    '<line class="grid-line" x1="'+PL+'" x2="'+(W-PR)+'" y1="'+(PT+ph)+'" y2="'+(PT+ph)+'" style="stroke:var(--line-2)"/>'+g+'</svg>'+
    '<div class="tip" id="barTip"></div>';
  requestAnimationFrame(()=>host.parentElement.classList.add('drawn')||host.classList.add('drawn'));
  host.classList.add('drawn');
  const tip=host.querySelector('#barTip'), svgEl=host.querySelector('svg');
  host.querySelectorAll('.g-group').forEach(grp=>{
    const s=series[+grp.dataset.i];
    function show(){
      host.classList.add('dim'); grp.classList.add('hot');
      tip.innerHTML='<b>'+esc(mkTitle(s.key))+'</b>'+
        '<div class="tr"><span class="dot" style="--c:var(--income)"></span>Доход<b>'+money(s.income)+'</b></div>'+
        '<div class="tr"><span class="dot" style="--c:var(--expense)"></span>Расход<b>'+money(s.expense)+'</b></div>'+
        '<div class="tr" style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px"><span class="dot" style="--c:var(--acc-3)"></span>Итог<b style="color:'+(s.net>=0?'var(--income)':'var(--expense)')+'">'+money(s.net,{plus:true})+'</b></div>';
      const r=svgEl.getBoundingClientRect(), hr=grp.querySelector('.hit').getBoundingClientRect();
      tip.style.left=(hr.left-r.left+hr.width/2)+'px';
      tip.style.top=(hr.top-r.top)+'px';
      tip.classList.add('on');
    }
    function hide(){ host.classList.remove('dim'); grp.classList.remove('hot'); tip.classList.remove('on'); }
    grp.addEventListener('mouseenter',show); grp.addEventListener('mousemove',show);
    grp.addEventListener('mouseleave',hide);
    grp.addEventListener('focus',show); grp.addEventListener('blur',hide);
    grp.setAttribute('tabindex','0'); grp.setAttribute('role','button');
    grp.setAttribute('aria-label',mkTitle(s.key)+': доход '+money(s.income)+', расход '+money(s.expense));
  });
}
const stub=(x,y,w)=>'<rect class="zero-stub" x="'+x+'" y="'+(y+w*0)+'" width="'+w+'" height="2" rx="1"/>';
function topBar(x,y,w,h,r){
  r=Math.min(r,w/2,h);
  return 'M'+x+','+(y+h)+' L'+x+','+(y+r)+' Q'+x+','+y+' '+(x+r)+','+y+' L'+(x+w-r)+','+y+' Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+' L'+(x+w)+','+(y+h)+' Z';
}

/* ===== ДОНАТ ===== */
function mountDonut(host, items, total){
  if(!host) return;
  const R=62, SW=20, C=2*Math.PI*R, cx=80, cy=80;
  let off=0, segs='';
  items.forEach((it,i)=>{
    const frac=it.val/(total||1);
    const len=Math.max(0,frac*C-2.5);
    segs+='<circle class="donut-seg" data-i="'+i+'" cx="'+cx+'" cy="'+cy+'" r="'+R+'" stroke="'+it.color+'" stroke-width="'+SW+'" '+
      'fill="none" stroke-dasharray="0 '+C+'" data-da="'+len+' '+(C-len)+'" transform="rotate('+(-90+off*360)+' '+cx+' '+cy+')" '+
      'style="filter:drop-shadow(0 0 8px '+it.color+'55)"/>';
    off+=frac;
  });
  host.innerHTML='<svg viewBox="0 0 160 160" role="img" aria-label="Расходы по категориям">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="'+SW+'"/>'+segs+'</svg>';
  requestAnimationFrame(()=>host.querySelectorAll('.donut-seg').forEach((s,i)=>{
    setTimeout(()=>{ s.style.strokeDasharray=s.dataset.da; }, RM?0:i*70);
  }));
  const legend=$('#donutLegend'), center=$('#donutCenter');
  if(legend) legend.innerHTML=items.map((it,i)=>{
    const p=Math.round(it.val/(total||1)*100);
    return '<button class="lg-row" data-act="cat-drill" data-cat="'+it.id+'" data-i="'+i+'">'+
      '<span class="dot" style="--c:'+it.color+'"></span>'+
      '<span class="lg-name">'+esc(it.name)+'</span>'+
      '<span class="lg-amt mono">'+money(it.val)+'</span>'+
      '<span class="lg-pct">'+p+'%</span></button>';
  }).join('');
  const svgEl=host.querySelector('svg');
  function hot(i){
    svgEl.classList.add('hov'); const d=host.querySelector('.donut');
    host.classList.add('hov');
    svgEl.querySelectorAll('.donut-seg').forEach(s=>s.classList.toggle('hot',+s.dataset.i===i));
    const it=items[i]; if(!it) return;
    center.innerHTML='<small>'+esc(it.name)+'</small><b class="mono">'+money(it.val)+'</b><span>'+Math.round(it.val/(total||1)*100)+'% от расходов</span>';
  }
  function cold(){
    host.classList.remove('hov');
    svgEl.querySelectorAll('.donut-seg').forEach(s=>s.classList.remove('hot'));
    center.innerHTML='<small>Потрачено</small><b class="mono">'+compact(total)+'</b><span>'+(CUR[state.settings.currency]||CUR.RUB).sym+' · '+items.length+' '+plural(items.length,'категория','категории','категорий')+'</span>';
  }
  host.addEventListener('mouseover',e=>{ const s=e.target.closest('.donut-seg'); if(s) hot(+s.dataset.i); });
  host.addEventListener('mouseout',e=>{ if(!e.relatedTarget||!e.relatedTarget.closest?.('.donut-seg')) cold(); });
  legend?.addEventListener('mouseover',e=>{ const r=e.target.closest('.lg-row'); if(r) hot(+r.dataset.i); });
  legend?.addEventListener('mouseout',cold);
  legend?.addEventListener('focusin',e=>{ const r=e.target.closest('.lg-row'); if(r) hot(+r.dataset.i); });
  legend?.addEventListener('focusout',cold);
}

function filteredTx(){
  const f=ui.tx;
  let list=state.transactions.filter(t=>{
    if(f.type!=='all'&&t.type!==f.type) return false;
    if(f.cat!=='all'&&t.categoryId!==f.cat) return false;
    if(!inPeriod(t,f.period)) return false;
    if(f.q){ const q=f.q.toLowerCase();
      if(!String(t.comment).toLowerCase().includes(q)&&!txCat(t).name.toLowerCase().includes(q)) return false; }
    return true;
  });
  list.sort((a,b)=> f.sort==='desc'?byDateDesc(a,b):f.sort==='asc'?byDateDesc(b,a):(a.type==='income'?-1:1)-(b.type==='income'?-1:1)||b.amount-a.amount);
  return list;
}

function debounce(fn,ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),ms); }; }
function positionSegs(root){
  $$('.seg',root||document).forEach(seg=>{
    const btns=$$('.seg-btn',seg), thumb=seg.querySelector('.seg-thumb');
    if(!thumb) return;
    const i=Math.max(0,btns.findIndex(b=>b.getAttribute('aria-pressed')==='true'));

    thumb.style.width=b.offsetWidth+'px';
    thumb.style.transform='translateX('+(b.offsetLeft-3)+'px)';
  });
}

function goalCardHTML(g){
  const p=clamp(g.saved/g.target*100,0,100), done=g.saved>=g.target;
  const dl=g.deadline?parseISO(g.deadline):null;
  const days=dl?Math.round((dl-new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))/86400000):null;
  const remain=Math.max(0,g.target-g.saved);
  let dlChip='';
  if(dl){
    const cls=days<0?'late':days<=30?'soon':'';
    const txt=days<0?'просрочено на '+daysWord(-days):days===0?'дедлайн сегодня':daysWord(days);
    dlChip='<span class="dl '+cls+'">'+svg('cal',13)+esc(txt)+'</span>';
  }
  const speed=days&&days>0&&!done?remain/days:0;
  return '<div class="card lift goal'+(done?' done':'')+'" data-id="'+g.id+'" style="--c:'+(done?'var(--gold)':'var(--acc-3)')+'">'+
    '<div class="goal-h">'+
      '<span class="ico-chip" style="--c:'+(done?'var(--gold)':'var(--acc-3)')+'">'+svg(done?'checkCircle':'flag',18)+'</span>'+
      '<div style="min-width:0"><h4>'+esc(g.name)+'</h4>'+
        '<div style="font-size:12px;color:var(--muted);margin-top:2px">цель '+money(g.target)+'</div></div>'+
      (done?'<span class="goal-badge" title="Цель достигнута">'+svg('check',16)+'</span>':'')+
    '</div>'+
    '<div class="goal-nums"><b class="mono" style="color:'+(done?'var(--gold)':'inherit')+'">'+money(g.saved)+'</b>'+
      '<span>'+Math.round(p)+'%</span>'+
      (done?'<span style="color:var(--gold)">цель закрыта</span>':'<span>осталось '+money(remain)+'</span>')+'</div>'+
    '<div><div class="prog"><i data-w="'+p+'"></i></div>'+
      '<div class="prog-t"><span>'+(done?money(g.saved):money(g.saved)+' / '+money(g.target))+'</span><span>'+Math.round(p)+'%</span></div></div>'+
    '<div class="goal-foot">'+dlChip+
      (speed>0&&!done?'<span class="dl">'+svg('zap',13)+'по '+compact(speed)+' в день</span>':'')+
      '<div class="goal-acts">'+
        '<button class="btn ghost sm" data-act="deposit" data-id="'+g.id+'">'+svg('plus',14)+'Пополнить</button>'+
        '<button class="act" data-act="edit-goal" data-id="'+g.id+'" aria-label="Редактировать цель">'+svg('pencil',15)+'</button>'+
        '<button class="act del" data-act="del-goal" data-id="'+g.id+'" aria-label="Удалить цель">'+svg('trash',15)+'</button>'+
      '</div></div>'+
  '</div>';
}

function saveTx(id){
  const amtEl=$('#dAmount'), dateEl=$('#dDate'), comEl=$('#dComment');
  const amount=parseAmount(amtEl.value);
  let bad=false;
  const mark=(f,on)=>{ $(f).closest('[data-f]')?.classList.toggle('invalid',on); $(f).classList.toggle('on',on); if(on) bad=true; };
  mark('#eAmount',!(amount>0));
  mark('#eDate', !dateEl.value || dateEl.value>todayISO());
  mark('#eCat', !draft.cat);
  if(bad){ toast('Проверьте форму','warn',{desc:'Некоторые поля заполнены неверно'}); return; }
  const data={ type:draft.type, amount, date:dateEl.value, categoryId:draft.cat, comment:comEl.value.trim().slice(0,140) };
  if(id){
    const t=state.transactions.find(x=>x.id===id);
    Object.assign(t,data); save(); closeTopModal();
    toast('Операция обновлена','ok',{desc:txCat(t).name+' · '+money(t.amount)});
  }else{
    const t=Object.assign({id:uid(),created:Date.now()},data);
    state.transactions.push(t); save(); closeTopModal();
    if(mKey(t.date)!==ui.month) ui.month=mKey(t.date);
    toast('Транзакция добавлена','ok',{desc:txCat(t).name+' · '+money(t.amount,{plus:t.type==='income'})});
  }
  shown.clear(); renderChrome(); render();
}
function delTx(id){
  const i=state.transactions.findIndex(x=>x.id===id); if(i<0) return;
  const t=state.transactions[i];
  const row=$('.tx[data-id="'+id+'"]');
  const finish=()=>{
    state.transactions.splice(i,1); save();
    const api=modalStack.find(m=>m.el.querySelector('[form="txForm"]')); if(api) closeModal(api);
    shown.clear(); renderChrome(); render();
    toast('Операция удалена','danger',{action:{label:'Отменить',fn:()=>{ state.transactions.splice(i,0,t); save(); shown.clear(); renderChrome(); render(); toast('Восстановлено','ok'); }}, desc:txCat(t).name+' · '+money(t.amount)});
  };
  if(row){ row.classList.add('removing'); setTimeout(finish,RM?0:300); } else finish();
}

function exportJSON(){

function exportCSV(){
  if(!state.transactions.length){ toast('Нечего экспортировать','warn',{desc:'Список операций пуст'}); return; }
  const head=['Дата','Тип','Категория','Сумма','Комментарий'];
  const rows=[...state.transactions].sort(byDateDesc).map(t=>[t.date,t.type==='income'?'доход':'расход',txCat(t).name,String(t.amount).replace('.',','),'"'+String(t.comment).replace(/"/g,'""')+'"']);
  download('saldo-transactions-'+todayISO()+'.csv','\uFEFF'+[head.join(';'),...rows.map(r=>r.join(';'))].join('\n'),'text/csv;charset=utf-8');
  toast('CSV выгружен','ok',{desc:rows.length+' '+plural(rows.length,'строка','строки','строк')});
}
function importJSON(file){
  const fr=new FileReader();
  fr.onload=()=>{
    let p; try{ p=JSON.parse(fr.result); }catch(e){ return toast('Файл повреждён','danger',{desc:'Не удалось разобрать JSON'}); }
    const tx=(p.transactions||[]).map(normalizeTx).filter(Boolean);
    const cats=(p.categories||[]).map(normalizeCat).filter(Boolean);
    const goals=(p.goals||[]).map(normalizeGoal).filter(Boolean);
    if(!tx.length&&!goals.length&&!cats.length) return toast('Данных не найдено','warn',{desc:'Проверьте структуру файла'});
    confirmDlg({title:'Импортировать данные?',text:'В файле <b class="mono" style="color:var(--txt)">'+tx.length+'</b> операций, <b class="mono" style="color:var(--txt)">'+cats.length+'</b> категорий, <b class="mono" style="color:var(--txt)">'+goals.length+'</b> целей.<br>Текущие данные будут заменены.',confirm:'Импортировать',danger:true,icon:'upload'})
    .then(ok=>{
      if(!ok) return;
      state.transactions=tx; state.goals=goals;
      if(cats.length) state.categories=cats;
      if(p.settings) state.settings=Object.assign(state.settings,p.settings,{theme:state.settings.theme});
      save(); shown.clear(); renderChrome(); render();
      toast('Данные импортированы','ok',{desc:tx.length+' операций загружено'});
    });
  };
  fr.readAsText(file);
}
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function demoData(){
  const rnd=mulberry(20260922), today=new Date(), cid=n=>state.categories.find(c=>c.name===n)?.id;
  const push=(type,amount,date,cat,comment)=>{
    if(date>todayISO()) return;
    state.transactions.push({id:uid(),type,amount:Math.round(amount*100)/100,date,categoryId:cid(cat)||cid('Другое'),comment,created:Date.now()-Math.random()*1e6});
  };
  const D=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
  for(let back=5;back>=0;back--){
    const base=new Date(today.getFullYear(),today.getMonth()-back,1);
    const y=base.getFullYear(), m=base.getMonth()+1, dim=new Date(y,m,0).getDate();
    push('income',168000+Math.round(rnd()*9000),D(y,m,5),'Зарплата','Оклад за '+mkTitle(y+'-'+pad(m),false));

    if(rnd()>.6) push('income',4000+Math.round(rnd()*9000),D(y,m,19),'Продажа','Продал старое на маркетплейсе');
    push('income',1800+Math.round(rnd()*900),D(y,m,1),'Проценты','Купоны по облигациям');
    if(rnd()>.75) push('income',5000,D(y,m,22),'Подарок','Денежный подарок');
    push('expense',45000,D(y,m,3),'Жильё','Аренда квартиры');
    push('expense',820,D(y,m,12),'Связь','Мобильный + домашний интернет');
    if(rnd()>.5) push('expense',3990,D(y,m,14),'Развлечения','Подписка на стриминг');
    push('expense',1490,D(y,m,20),'Здоровье','Аптека');
    if(rnd()>.6) push('expense',12000+Math.round(rnd()*24000),D(y,m,8+Math.floor(rnd()*6)),'Образование','Онлайн-курс');
    if(rnd()>.55) push('expense',4500+Math.round(rnd()*11000),D(y,m,16+Math.floor(rnd()*7)),'Одежда','Сезонная покупка');
    for(let i=0;i<9;i++){ const d=1+Math.floor(rnd()*dim); push('expense',900+rnd()*3900,D(y,m,d),'Продукты',['Пятёрочка','Магнит','ВкусВилл','Самбери','Лента'][Math.floor(rnd()*5)]); }
    for(let i=0;i<11;i++){ const d=1+Math.floor(rnd()*dim); push('expense',80+rnd()*620,D(y,m,d),'Транспорт',['Такси','Метро','Каршеринг','Бензин'][Math.floor(rnd()*4)]); }
    for(let i=0;i<5;i++){ const d=1+Math.floor(rnd()*dim); push('expense',450+rnd()*3400,D(y,m,d),'Развлечения',['Кафе','Кино','Концерт','Бар','Игры'][Math.floor(rnd()*5)]); }
  }
  state.goals=[
    {id:uid(),name:'Резервный фонд',target:400000,saved:236000,deadline:D(today.getFullYear(),12,31),created:Date.now()},
    {id:uid(),name:'Путешествие в Грузию',target:180000,saved:97500,deadline:D(today.getFullYear()+1,5,1),created:Date.now()},
    {id:uid(),name:'Новый монитор',target:62000,saved:62000,deadline:'',created:Date.now()}
  ];
}

function applyTheme(){ document.documentElement.dataset.theme=state.settings.theme==='light'?'light':'dark';
  const mt=document.querySelector('meta[name=theme-color]'); if(mt) mt.content=state.settings.theme==='light'?'#f3f4f9':'#0e0e14'; }

/* ---------- 16. ДЕЙСТВИЯ (делегирование) ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-close]'); if(!b) return;
  if(b.hasAttribute('data-close')){ const api=modalStack.find(m=>m.el.contains(b)); if(api) closeModal(api); return; }
  const a=b.dataset.act, id=b.dataset.id;
  switch(a){
    case 'go': go(b.dataset.view); break;
    case 'toggle-theme': toggleTheme(); break;
    case 'shortcuts': shortcutsModal(); break;
    case 'new-tx': txModal(); break;
    case 'tx-edit': txModal(id); break;
    case 'tx-del': delTx(id); break;
    case 'tx-save': e.preventDefault(); saveTx(id||null); break;
    case 'd-type': setDraftType(b.dataset.v); break;
    case 'd-cat': draft.cat=id; $$('#dCats .chip[data-act="d-cat"]').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.id===id))); $('#eCat').classList.remove('on'); $('#dCats').closest('[data-f]').classList.remove('invalid'); break;
    case 'd-newcat': catModal(draft.type); break;
    case 'new-cat': catModal(b.dataset.type); break;
    case 'edit-cat': catModal(id); break;
    case 'del-cat': delCat(id); break;
    case 'cat-save': saveCat(id||null); break;
    case 'd-ctype': cdraft.type=b.dataset.v; $$('.seg-btn[data-act="d-ctype"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===cdraft.type))); positionSegs($('.modal.in')); previewCat(); break;
    case 'd-ccol': cdraft.color=b.dataset.v; $$('.sw').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===cdraft.color))); previewCat(); break;
    case 'd-cicon': cdraft.icon=b.dataset.v; $$('.ic-pick').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===cdraft.icon))); previewCat(); break;
    case 'new-goal': goalModal(); break;
    case 'edit-goal': goalModal(id); break;
    case 'del-goal': delGoal(id); break;
    case 'goal-save': saveGoal(id||null); break;
    case 'deposit': depositModal(id); break;
    case 'dep-quick': { const el=$('#depAmount'); el.value=String(+b.dataset.v||'').replace(/(\d)(?=(\d{3})+$)/g,'$1 '); el.focus(); break; }
    case 'dep-save': {
      const g=state.goals.find(x=>x.id===id), v=parseAmount($('#depAmount').value);
      const err=$('#eDep');
      if(!(v>0)){ err.classList.add('on'); $('#depAmount').closest('[data-f]').classList.add('invalid'); return; }
      g.saved=Math.round((g.saved+v)*100)/100; save(); closeTopModal(); render();
      toast(g.saved>=g.target?'Цель достигнута':'Цель пополнена', g.saved>=g.target?'warn':'ok', {desc:g.name+' · '+money(g.saved)+' из '+money(g.target)});
      break;
    }
    case 'month': { const d=+b.dataset.dir; const nk=shiftMK(ui.month,d); if(nk<=curMK()){ ui.month=nk; render(); } break; }
    case 'month-now': ui.month=curMK(); render(); break;
    case 'f-type': ui.tx.type=b.dataset.v; renderTransactions(); break;
    case 'f-clear': ui.tx={...ui.tx,type:'all',cat:'all',period:'all',q:'',sort:'desc',limit:40}; renderTransactions(); break;
    case 'more': ui.tx.limit+=40; renderTransactions(); break;
    case 'cat-tab': ui.catTab=b.dataset.v; renderCategories(); break;
    case 'cat-drill': ui.tx={...ui.tx,type:'expense',cat:b.dataset.cat||'all',period:ui.month,q:'',limit:40}; go('transactions'); break;
    case 'weekstart': state.settings.weekStart=+b.dataset.v; save(); renderChrome(); render(); toast('Первый день недели обновлён','info',{desc:+b.dataset.v===1?'воскресенье':'понедельник'}); break;
    case 'set-theme': if(state.settings.theme!==b.dataset.v) toggleTheme(); break;
    case 'export': exportJSON(); break;
    case 'csv': exportCSV(); break;
    case 'import': $('#filePicker').click(); break;
    case 'demo': loadDemo(); break;
    case 'reset': resetAll(); break;
    case 'wipe-tx': confirmDlg({title:'Удалить все операции?',text:'Будет удалено <b style="color:var(--txt)">'+state.transactions.length+'</b> транзакций. Категории, цели и настройки останутся.',confirm:'Удалить',danger:true,icon:'trash'}).then(ok=>{ if(!ok)return; state.transactions=[]; save(); shown.clear(); renderChrome(); render(); toast('Операции удалены','danger'); }); break;
  }
});
document.addEventListener('submit',e=>{ if(e.target.id==='txForm'){ e.preventDefault(); saveTx(e.submitter?.dataset.id||null); } });
$('#filePicker').addEventListener('change',e=>{ const f=e.target.files?.[0]; if(f) importJSON(f); e.target.value=''; });

/* ---------- 17. СТАРТ ---------- */
(function boot(){
  const had=load();
  applyTheme();
  renderChrome();
  $$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+ui.view));
  render();
  const fill=$('#bootFill'), boot=$('#boot');
  let p=0;
  const tick=setInterval(()=>{ p=Math.min(100,p+16+Math.random()*22); fill.style.width=p+'%'; if(p>=100) clearInterval(tick); },70);
  setTimeout(()=>{
    fill.style.width='100%';
    boot.classList.add('off');
    setTimeout(()=>boot.remove(),520);
    topline();
    requestAnimationFrame(()=>{ positionSegs(); reveals(); });
    if(!had) setTimeout(()=>toast('Хранилище пусто','info',{desc:'Добавьте операцию (N) или загрузите демо-данные в настройках',duration:6000}),700);
  },720);
})();
/* мягкое появление mbar/прогрессов после отрисовки */
const mo=new MutationObserver(()=>{ requestAnimationFrame(()=>$$('.mbar i,.prog i,.cat-share i').forEach(el=>{ if(el.dataset.w!=null) el.style.width=el.dataset.w+'%'; })); });
mo.observe(document.getElementById('main'),{childList:true,subtree:true});
</script>
</body>
