<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e14">
<title>Сальдо — трекер личных финансов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Перейти к содержимому</a>

<div class="boot" id="boot">
  <div class="boot-in">
    <div class="brand-mark" style="width:44px;height:44px;border-radius:14px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17.5 8.5 11l4 3.6L21 6"/><path d="M15.5 6H21v5.4"/><circle cx="8.5" cy="11" r="1.4" fill="currentColor" stroke="none"/></svg>
    </div>
    <div class="boot-bar"><i id="bootFill"></i></div>
    <p class="boot-txt">Сальдо · загрузка</p>
  </div>
</div>

<div class="topline" id="topline"><i id="topFill"></i></div>

<div class="bg" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17.5 8.5 11l4 3.6L21 6"/><path d="M15.5 6H21v5.4"/></svg>
      </div>
      <div>
        <span class="brand-name">Сальдо</span>
        <span class="brand-sub">finance&nbsp;tracker</span>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Основная навигация"></nav>
    <div class="side-foot">
      <div class="gauge-card" id="gaugeCard"></div>
      <button class="mini-btn" data-act="shortcuts">
        <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="3"/><path d="M7 10h.01M11 10h.01M15 10h.01M7.5 14h9"/></svg>
        Горячие клавиши
        <kbd style="margin-left:auto">?</kbd>
      </button>
      <button class="mini-btn" data-act="toggle-theme" id="themeBtnSide"></button>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <div class="tb-title" id="tbTitle"></div>
      <div class="tb-acts" id="tbActs"></div>
    </header>
    <main class="main" id="main">
      <section class="view" id="v-overview" role="region" aria-label="Обзор"></section>
      <section class="view" id="v-transactions" role="region" aria-label="Транзакции"></section>
      <section class="view" id="v-categories" role="region" aria-label="Категории"></section>
      <section class="view" id="v-goals" role="region" aria-label="Цели"></section>
      <section class="view" id="v-settings" role="region" aria-label="Настройки"></section>
    </main>
  </div>
</div>

<nav class="tabbar" aria-label="Навигация"><div class="in" id="tabbar"></div></nav>
<button class="fab" data-act="new-tx" aria-label="Добавить транзакцию">
  <svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="modal-root" id="modalRoot"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="filePicker" accept="application/json,.json" class="sr" aria-hidden="true" tabindex="-1">

<script src="js/app.js"></script>
</body>
</html>
